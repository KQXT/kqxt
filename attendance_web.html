<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考勤记录处理工具</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
.header { background: #1677ff; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .version { font-size: 12px; opacity: 0.7; margin-top: 2px; }
.container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; overflow: hidden; }
.card-header { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 20px; }
.upload-area { border: 2px dashed #d9d9d9; border-radius: 8px; text-align: center; padding: 40px 20px; cursor: pointer; transition: all 0.2s; background: #fafafa; }
.upload-area:hover, .upload-area.drag-over { border-color: #1677ff; background: #e8f4ff; }
.upload-area .icon { font-size: 40px; margin-bottom: 12px; }
.upload-area p { color: #666; margin-bottom: 8px; }
.upload-area .hint { font-size: 12px; color: #999; }
#fileInput { display: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s; }
.btn-primary { background: #1677ff; color: #fff; }
.btn-primary:hover { background: #0958d9; }
.btn-primary:disabled { background: #91caff; cursor: not-allowed; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #389e0d; }
.btn-success:disabled { background: #b7eb8f; cursor: not-allowed; }
.btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
.btn-default:hover { border-color: #1677ff; color: #1677ff; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.progress-bar { height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-bar .fill { height: 100%; background: #1677ff; border-radius: 3px; transition: width 0.3s; }
.log-area { max-height: 200px; overflow-y: auto; background: #1a1a2e; color: #a9b7c6; padding: 12px; border-radius: 6px; font-size: 12px; font-family: 'Consolas', monospace; }
.log-area .log-ok { color: #6fc68e; }
.log-area .log-warn { color: #f0b46c; }
.log-area .log-err { color: #f07070; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.stat-card { background: #f8f9fa; border-radius: 6px; padding: 12px; text-align: center; }
.stat-card .num { font-size: 24px; font-weight: 700; color: #1677ff; }
.stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
.table-wrap { overflow: auto; max-height: 500px; border: 1px solid #f0f0f0; border-radius: 6px; }
table { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
th { background: #fafafa; position: sticky; top: 0; z-index: 10; padding: 8px 10px; border: 1px solid #e8e8e8; font-weight: 600; text-align: center; }
td { padding: 4px 8px; border: 1px solid #e8e8e8; vertical-align: top; text-align: center; max-width: 100px; }
td.punch-cell { white-space: pre-wrap; text-align: left; font-size: 11px; line-height: 1.6; }
.red { color: #ff4d4f; }
.orange-bg { background: #fff7e6; }
.hidden { display: none; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.tag-green { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
.tag-blue { background: #e8f4ff; color: #1677ff; border: 1px solid #91caff; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📊 考勤记录处理工具</h1>
    <div class="version">v2.14-26.08.23</div>
  </div>
</div>

<div class="container">
  <!-- 上传区 -->
  <div class="card">
    <div class="card-header">📂 上传原始考勤文件（得力系统导出）</div>
    <div class="card-body">
      <div class="upload-area" id="uploadArea">
        <div class="icon">📄</div>
        <p>点击选择或拖拽 Excel 文件到此处</p>
        <p class="hint">支持 .xlsx 格式（得力系统导出的原始考勤表）</p>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
      <div id="fileInfo" class="hidden" style="margin-top:12px; padding:10px; background:#f6ffed; border-radius:6px; color:#52c41a; font-size:13px;"></div>
      <!-- 当文件缺少日期表头时，显示月份补填框 -->
      <div id="monthPickerBox" class="hidden" style="margin-top:10px; padding:10px; background:#fffbe6; border:1px solid #ffe58f; border-radius:6px; font-size:13px;">
        ⚠️ 未检测到日期表头（周六/周日标识），请补填考勤月份以正确标识周末：
        <input type="number" id="inputYear" min="2020" max="2099" placeholder="年份" style="width:70px; margin:0 4px; padding:3px 6px; border:1px solid #d9d9d9; border-radius:4px;">
        年
        <input type="number" id="inputMonth" min="1" max="12" placeholder="月" style="width:50px; margin:0 4px; padding:3px 6px; border:1px solid #d9d9d9; border-radius:4px;">
        月
        <button onclick="applyManualMonth()" style="margin-left:8px; padding:3px 12px; background:#1890ff; color:#fff; border:none; border-radius:4px; cursor:pointer;">确认</button>
        <span id="monthPickerStatus" style="margin-left:8px; color:#52c41a;"></span>
      </div>
    </div>
  </div>

  <!-- 操作区 -->
  <div class="card">
    <div class="card-header">⚙️ 操作</div>
    <div class="card-body">
      <div class="actions">
        <button class="btn btn-primary" id="btnProcess" disabled onclick="startProcess()">▶ 开始处理</button>
        <button class="btn btn-success" id="btnExport" disabled onclick="exportExcel()">⬇ 导出Excel</button>
        <button class="btn btn-default" onclick="resetAll()">🔄 重置</button>
      </div>
      <div id="progressArea" class="hidden" style="margin-top:16px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#666; margin-bottom:6px;">
          <span id="progressLabel">处理中...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar"><div class="fill" id="progressFill" style="width:0"></div></div>
        <div class="log-area" id="logArea"></div>
      </div>
    </div>
  </div>

  <!-- 统计摘要 -->
  <div class="card hidden" id="summaryCard">
    <div class="card-header">📈 处理结果摘要</div>
    <div class="card-body">
      <div class="stats-grid" id="statsGrid"></div>
    </div>
  </div>

  <!-- 预览表格 -->
  <div class="card hidden" id="previewCard">
    <div class="card-header">
      👁 数据预览（前20行）
      <span class="tag tag-blue" style="margin-left:auto; font-size:11px;">橙色=周末 | 红色=迟到/缺卡/加班</span>
    </div>
    <div class="card-body">
      <div class="table-wrap" id="previewTable"></div>
    </div>
  </div>
</div>

// 获取当前HTML所在路径，自动加载同目录下的config.json
const CONFIG_URL = location.href.replace(/[^/]*$/, '') + 'config.json';

async function loadConfig() {
  // 先用内嵌默认配置兜底，确保本地 file:// 双击可用
  ALIAS_MAP = DEFAULT_CONFIG.ALIAS_MAP || {};
  DEPT_SHIFTS = DEFAULT_CONFIG.DEPT_SHIFTS || {};
  logMsg('ok', '默认班次配置已就绪，共 ' + Object.keys(DEPT_SHIFTS).length + ' 个部门');

  // 如果是在 http/https 环境下，尝试加载同目录 config.json 进行覆盖
  if (location.protocol.startsWith('http')) {
    try {
      const resp = await fetch(CONFIG_URL);
      if (!resp.ok) throw new Error('config.json 加载失败: ' + resp.status);
      const config = await resp.json();
      ALIAS_MAP = config.ALIAS_MAP || {};
      DEPT_SHIFTS = config.DEPT_SHIFTS || {};
      logMsg('ok', '线上 config.json 已加载并覆盖，共 ' + Object.keys(DEPT_SHIFTS).length + ' 个部门');
      return true;
    } catch (e) {
      logMsg('warn', '未找到线上 config.json，继续使用内嵌默认配置: ' + e.message);
      return true; // 有默认配置兜底，仍算成功
    }
  }
  return true;
}

// 工具函数
// ============================================================
function parseShiftTime(s) {
  if (!s) return null;
  const [h, m] = s.split(':').map(Number);
  return h * 60 + m;
}

function timeToMin(t) { return t.h * 60 + t.m; }

function getDeptShifts(dept) {
  if (!dept) return [];
  let val = DEPT_SHIFTS[dept];
  if (!val) {
    // 模糊匹配
    for (const [d, v] of Object.entries(DEPT_SHIFTS)) {
      if (Array.isArray(v) && (dept.includes(d) || d.includes(dept))) return v;
    }
    return [];
  }
  if (Array.isArray(val)) return val;
  if (typeof val === 'string' && val.startsWith('SAME_AS_')) {
    const refDept = ALIAS_MAP[val] || '';
    if (refDept && DEPT_SHIFTS[refDept]) {
      const rv = DEPT_SHIFTS[refDept];
      if (Array.isArray(rv)) return rv;
    }
  }
  return [];
}

// 解析打卡时间字符串为 [{h,m}] 数组
function parseTimes(str) {
  if (!str || str.trim() === '' || str.trim() === '-') return [];
  const times = [];
  for (const line of str.split('\n')) {
    const t = line.trim();
    if (!t || t === '-') continue;
    if (t.includes(':')) {
      const [h, m] = t.split(':').map(Number);
      if (!isNaN(h) && !isNaN(m)) times.push({h, m});
    }
  }
  // 排序：凌晨(h<5)放后面
  times.sort((a, b) => {
    const ka = a.h < 5 ? 1440 + a.h * 60 + a.m : a.h * 60 + a.m;
    const kb = b.h < 5 ? 1440 + b.h * 60 + b.m : b.h * 60 + b.m;
    return ka - kb;
  });
  return times;
}

// 去重（按休息时段分阈值：午餐12:00-13:30 间隔<15min合并；晚餐17:30-18:00 间隔<5min合并；其余<5min合并）
function dedupTimes(times) {
  if (times.length <= 1) return times;
  const LUNCH = [12 * 60, 13 * 60 + 30];    // 12:00-13:30 午餐休息
  const DINNER = [17 * 60 + 30, 18 * 60];   // 17:30-18:00 晚餐休息
  const inRange = (m, r) => m >= r[0] && m <= r[1];
  const thresholdFor = (a, b) => {
    if (inRange(a, DINNER) || inRange(b, DINNER)) return 5;   // 晚餐休息：≥5min 算两次(下午下班+晚上加班上班)
    if (inRange(a, LUNCH) || inRange(b, LUNCH)) return 15;    // 午餐休息：≥15min 算两次(中午下班+下午上班)
    return 5;                                                   // 其余时段基础去重
  };
  const res = [times[0]];
  for (let i = 1; i < times.length; i++) {
    const a = timeToMin(res[res.length - 1]);
    const b = timeToMin(times[i]);
    let gap = b - a;
    if (gap < 0) gap += 1440;
    if (gap >= thresholdFor(a, b)) res.push(times[i]);
  }
  return res;
}

// 判断班次是否与打卡分布矛盾（用于 canFill 与兜底池筛选）
// 矛盾情况：晚班需无上午卡；上午半天需无下午卡；下午半天需无上午卡
function shiftContradictsPattern(shift, hasMorning, hasAfternoon) {
  const sStart = parseShiftTime(shift.start);
  const sEnd = parseShiftTime(shift.end);
  if (sStart === null || sEnd === null) return true;
  // 跨天班次（如下班 00:00/00:30，或 end<start）：其 end 解析出来很小（<=30），
  // 不能再套用「上午半天(end<=12:00)」判定，否则会误把 16:00-00:30 这类夜班当成矛盾而排除。
  const crossDay = sEnd <= 30 || sEnd < sStart;
  if (!crossDay && sEnd <= 12 * 60 && hasAfternoon) return true; // 上午半天：有下午卡不可能
  if (sStart >= 15 * 60 && hasMorning) return true;              // 晚班：有上午卡不可能
  if (!crossDay && sStart >= 13 * 60 && hasMorning) return true; // 下午半天：有上午卡不可能
  return false;
}

// 班次匹配（四条件匹配法：能上满 + 最接近 + 优先不迟到 + 卡型吻合）
// 2026-08-17 修正：不再把"整月基准集"当硬性候选集（否则 8:00 主班、偶尔几天上 9:00 班的员工，
// 那几天首卡 8:57 会被吞并成 8:00 班、误标迟到 57 分钟）。
// 改为：全量通用表一次匹配，但整月基准班次在首卡距离上享受优势（BASE_BONUS，见 matchShiftInSet），
// 使"能解释为准点/早到的更晚班次"（如 09:00 解释 8:57）能胜出，同时真小迟到仍被主基准捕获。
function inferShiftFromDept(times, dept, useUniversal, dayIdx, processedDays) {
  const baseShifts = (EMP_CTX && EMP_CTX.baseShifts && EMP_CTX.baseShifts.length) ? EMP_CTX.baseShifts : null;
  return matchShiftInSet(times, UNIVERSAL_SHIFTS, dayIdx, processedDays, dept, baseShifts);
}

// 在给定班次集合内做四条件匹配（能上满 + 最接近 + 优先不迟到 + 卡型吻合）
// baseShifts 可选：该员工整月基准班次集合；基准班次的起点距离享 BASE_BONUS 优势。
function matchShiftInSet(times, shifts, dayIdx, processedDays, dept, baseShifts) {
  const cls0 = classifyPunchTimes(times);
  let anchorMin = null;
  if (cls0.morning_start.length) {
    anchorMin = timeToMin(cls0.morning_start[0]);
  } else if (dayIdx !== undefined && processedDays) {
    const nb = inferNeighborStart(dayIdx, processedDays, dept);
    if (nb !== null && nb !== undefined) anchorMin = nb;
  }
  if (anchorMin === null) {
    const normalTimes = times.filter(t => t.h >= 6);
    if (!normalTimes.length) return null;
    anchorMin = timeToMin(normalTimes[0]);
  }
  // 匹配哲学：早到的概率＞迟到的概率。
  // 首卡与班次起点的「距离」按早到/迟到分别加权：早到轻罚(EARLY_W)、迟到重罚(LATE_W)。
  // 这样 7:40 这类歧义首卡会被解释为「8:00 班早到 20 分钟」，而非「7:30 班迟到 10 分钟」。
  const EARLY_W = 0.3;
  const LATE_W = 1.0;
  // 基准班次优势（2026-08-17）：
  //  - 首卡为「早到」（<= 基准起点）或「小迟到」（< 30 分钟）时，基准起点 -30 分优势
  //    → 系统性早到鸟稳定归基准班次；真小迟到（如 7:30 班 7:40 到）不被 8:00 班"早到解释"篡夺。
  //  - 首卡晚于基准起点 ≥30 分钟（大迟到/疑似换班）时优势失效
  //    → 让更晚班次的"早到解释"公平竞争（8:00 主班偶尔上 9:00 班，8:57 归 09:00 班，不误标迟到）。
  const BASE_BONUS = 30;
  const baseSet = (baseShifts && baseShifts.length) ? new Set(baseShifts.map(s => s.start)) : null;
  let bestStart = null, bestW = Infinity;
  const startSet = new Set();
  for (const s of shifts) startSet.add(s.start);
  for (const sStr of startSet) {
    const sMin = parseShiftTime(sStr);
    let w;
    if (anchorMin <= sMin) w = (sMin - anchorMin) * EARLY_W;   // 早到：轻罚
    else w = (anchorMin - sMin) * LATE_W;                       // 迟到：重罚
    if (baseSet && baseSet.has(sStr)) {
      const lateBy = anchorMin - sMin;
      if (lateBy <= 0 || lateBy < BASE_BONUS) w -= BASE_BONUS;
    }
    if (w > 120) continue;
    // 加权距离相同时，偏好更晚的班次起点（即「早到」解释），贯彻早到优先
    if (w < bestW || (w === bestW && sMin > parseShiftTime(bestStart))) {
      bestW = w; bestStart = sStr;
    }
  }
  if (!bestStart) return null;
  const cands = shifts.filter(s => s.start === bestStart);
  const halfCand = cands.find(c => c.day_val < 1);
  const fullCand = cands.find(c => c.day_val >= 1);
  const hasWorkPast = (halfEndMin) => times.some(t => punchMinOf(t) >= halfEndMin + 30);
  let chosen = null;
  if (halfCand && fullCand) {
    chosen = hasWorkPast(endMinOf(halfCand)) ? fullCand : halfCand;
  } else {
    chosen = fullCand || halfCand || null;
  }
  return chosen;
}

// 获取部门所有班次中最早的上班时间（用于迟到判断基准）
// 返回分钟数，无班次时返回null
function getDeptEarliestStart(dept) {
  const shifts = getDeptShifts(dept);
  if (!shifts.length) return null;
  let earliest = null;
  for (const s of shifts) {
    const m = parseShiftTime(s.start);
    if (m === null) continue;
    // 跳过半天班中的下午半天（start>=13:30），它们不影响上午迟到判断
    if (m >= 13 * 60 && (s.net_h || 8) < 5) continue;
    if (earliest === null || m < earliest) earliest = m;
  }
  return earliest;
}

// 统一的最佳班次推断函数
// 返回完整的班次对象 {start, end, net_h, break_min, ...} 或 null
// 优先用部门配置，匹配不合理时自动用通用模板兜底
function getBestShift(times, dept, dayIdx, processedDays) {
  const normal = times.filter(t => t.h >= 6);
  if (!normal.length) return null;
  // 2026-08-19 锁定基准：有员工整月基准时，每天班次只在基准集合内选（优先不晚于首卡），
  // 不再用当天打卡反推任意班次。彻底解决"相邻班次 + 迟到 → 匹配漂移"与逐日张冠李戴。
  if (EMP_CTX && EMP_CTX.baseShifts && EMP_CTX.baseShifts.length) {
    const fMin = firstMorningMinOf(times);
    if (fMin !== null) {
      const bs = pickBaseShiftFromList(EMP_CTX.baseShifts, fMin);
      if (bs) return bs;
    }
  }
  return inferShiftFromDept(times, dept, true, dayIdx, processedDays) || null;
}

function getShiftStartFromDept(times, dept) {
  if (dept.includes('保安') || dept.includes('卫生')) {
    const normal = times.filter(t => t.h >= 6);
    if (normal.length && normal.some(t => t.h < 12)) return {h:6, m:30};
    return {h:16, m:0};
  }
  const best = getBestShift(times, dept);
  if (best) {
    const [h, m] = best.start.split(':').map(Number);
    return {h, m};
  }
  const normal = times.filter(t => t.h >= 6);
  if (!normal.length) return {h:8, m:0};
  // 最终兜底：按第一张打卡小时推断（整点）
  const first = normal[0];
  if (first.h <= 7) return {h:7, m:0};
  if (first.h === 8) return {h:8, m:0};
  if (first.h === 9) return {h:9, m:0};
  if (first.h === 10) return {h:10, m:0};
  if (first.h === 13) return {h:13, m:30};
  if (first.h >= 15) return {h:15, m:0};
  return {h:first.h, m:0};
}

// ============================================================
// 按人聚类定基准班次（2026-08-16 新增）
// 思路：单张首卡单独看无法区分「早到」还是「迟到」（07:40 既可是 8:00 班早到、也可是 7:30 班迟到）。
//       但一个人整月的首卡合起来有模式：早到是系统性的（每天偏早一个稳定量），迟到是偶发的（一月就几天）。
//       因此对员工整月首卡做"早到轻罚"映射，聚出他/她专属的 1~N 个基准班次起点：
//         - 单一基准（绝大多数人）：整月都偏早/准点 → 该基准即其真实班次，边界歧义首卡一律判早到，不误伤。
//         - 双基准（如保安月内换早/晚班）：两班都达阈值才成立，按天归到更近的基准。
//         - 偶发迟到：少数迟到天若不足 25% 阈值，不会形成第二基准 → 仍用主基准比对 → 真迟到被精准标红。
//       迟到/早退判定与出勤/加班计算都改用该员工基准，比逐日"最近起点"更稳更准。
// ============================================================
let EMP_CTX = null;  // 当前正在处理的员工基准上下文（processEmployee 内设置）

// 早到轻罚映射：把分钟数映射到最近的班次起点（与 inferShiftFromDept 同哲学）
// allowedStarts 可选：有部门配置时限定为部门班次起点，防止通用班次里的 07:30 把 08:00 部门的早到鸟误判迟到
function snapStartEarlyBias(fMin, allowedStarts) {
  const EARLY_W = 0.3, LATE_W = 1.0;
  let best = null, bestW = Infinity;
  const set = new Set();
  const source = (allowedStarts && allowedStarts.length) ? allowedStarts : UNIVERSAL_SHIFTS.map(s => s.start);
  for (const sStr of source) set.add(sStr);
  for (const sStr of set) {
    const sMin = parseShiftTime(sStr);
    const w = (fMin <= sMin) ? (sMin - fMin) * EARLY_W : (fMin - sMin) * LATE_W;
    if (w > 120) continue;
    if (w < bestW || (w === bestW && sMin > parseShiftTime(best))) { bestW = w; best = sStr; }
  }
  return best;
}

// 中性最近映射：在给定基准集合内，按绝对距离选最近起点（用于迟到当天归班）
// 平局偏好更晚起点（延续"早到优先"，边界歧义不误伤）
function snapStartNeutral(fMin, baseShifts) {
  let best = null, bestD = Infinity;
  for (const s of baseShifts) {
    const sMin = parseShiftTime(s.start);
    const d = Math.abs(fMin - sMin);
    if (d < bestD || (d === bestD && sMin > parseShiftTime(best ? best.start : '99:99'))) { bestD = d; best = s; }
  }
  return best;
}

// 按"到达+离开"双重拟合推断单日最贴合班次（用于定基准，避免早到轻罚把迟到鸟误吸到更晚班次）
// 到达偏差：早到轻罚、迟到重罚；离开偏差同样处理，但权重更高(DEP_W)，
// 因"下班时间"是判别真实班次的关键信号（06:30 班≈16:00 下班，07:00 班≈16:30+ 下班）。
function inferDayShiftBySpan(times, sourceShifts) {
  if (!times || !times.length || !sourceShifts || !sourceShifts.length) return null;
  const cls = classifyPunchTimes(times);
  let arrMin = null;
  if (cls.morning_start.length) arrMin = timeToMin(cls.morning_start[0]);
  else { const nt = times.filter(t => t.h >= 6); if (nt.length) arrMin = timeToMin(nt[0]); }
  if (arrMin === null) return null;
  let depMin = null;
  const depCands = [...cls.afternoon_end, ...cls.overtime_end, ...cls.afternoon_start, ...cls.noon_end];
  if (depCands.length) depMin = Math.max(...depCands.map(t => punchMinOf(t)));
  else depMin = Math.max(...times.map(t => punchMinOf(t)));
  if (depMin === null || isNaN(depMin)) return null;
  const EARLY_W = 0.3, LATE_W = 1.0, DEP_W = 1.5;
  let best = null, bestCost = Infinity;
  for (const s of sourceShifts) {
    const sStart = parseShiftTime(s.start);
    const sEnd = endMinOf(s);
    if (sStart === null || sEnd === null) continue;
    if (arrMin > sEnd + 60) continue;        // 到达远晚于下班 → 矛盾
    if (depMin < sStart - 120) continue;      // 离开远早于上班 → 矛盾
    const arrDev = (arrMin >= sStart) ? (arrMin - sStart) * LATE_W : (sStart - arrMin) * EARLY_W;
    const depDev = (depMin <= sEnd) ? (sEnd - depMin) * LATE_W : (depMin - sEnd) * LATE_W;
    const cost = arrDev + depDev * DEP_W;
    if (cost < bestCost) { bestCost = cost; best = s; }
  }
  return best;
}

// 取员工某天对应的基准班次：在 emp._baseShifts 中选起点最贴近当天首卡者，
// 优先"不晚于首卡"的基准（即员工在自己班次内早到/准点），其余取最近。供迟到/早退判定同源使用。
// 在给定基准班次集合内，用"中性绝对距离"选起点最贴近当天首卡者。
// 这是"锁定整月基准、不再按当天打卡反推任意班次"的核心：相邻班次、迟到、换班都不会再漂移。
// 用中性距离(而非"优先不晚于首卡")，可同时正确处理两类情况：
//   - 08:00 主班、某天迟到 08:25 → |08:00-08:25|=25 < |09:00-08:25|=35 → 仍归 08:00（迟到25，不被吸到 09:00）
//   - 09:00 次班、某天早到 08:50 → |09:00-08:50|=10 < |08:00-08:50|=50 → 归 09:00（早到10，不被误吸回 08:00 标迟到）
function pickBaseShiftFromList(baseShifts, fMin) {
  if (!baseShifts || !baseShifts.length) return null;
  let best = null, bestD = Infinity;
  for (const s of baseShifts) {
    const sm = parseShiftTime(s.start);
    if (sm === null) continue;
    const d = Math.abs(fMin - sm);
    if (d < bestD || (d === bestD && parseShiftTime(s.start) > parseShiftTime(best ? best.start : '99:99'))) {
      bestD = d; best = s;
    }
  }
  return best;
}
function pickBaseShiftForDay(emp, fMin) {
  return pickBaseShiftFromList(emp && emp._baseShifts, fMin);
}

function firstMorningMinOf(times) {
  const cls = classifyPunchTimes(times);
  if (cls.morning_start.length) return timeToMin(cls.morning_start[0]);
  const nt = times.filter(t => t.h >= 6);
  return nt.length ? timeToMin(nt[0]) : null;
}
function lastDepartureMinOf(times) {
  const cls = classifyPunchTimes(times);
  const cands = [...cls.afternoon_end, ...cls.overtime_end, ...cls.afternoon_start];
  if (!cands.length) return null;
  return Math.max(...cands.map(t => punchMinOf(t)));
}
// 迟到/早退判定用的"当日班次"：优先员工整月基准（与出勤同源、稳定，避免逐日匹配漂移），
// 但若当日离开远早于基准班次下班(>60分)，说明当天并非基准班次（如夜班员工偶上早班），
// 则改用当日"到达+离开"双重拟合班次，避免把 22:08 这类正常下班误判为早退。
function resolveShiftForDay(emp, times, dept, dayIdx, processedDays) {
  // 2026-08-19 锁定基准：每天一律用员工整月基准班次判定迟到/早退，
  // 不再用当天"到达+离开"拟合(dayShift)反推，彻底避免逐日漂移与误判早退/迟到。
  // 疑似迟到/早走的日子也统一归整月基准班次，迟到/早退单独标记，不另拟合班次。
  const fMin = firstMorningMinOf(times);
  const baseShift = (fMin !== null) ? pickBaseShiftForDay(emp, fMin) : null;
  if (baseShift) return baseShift;
  // 兜底：无整月基准（极端/异常数据）才退回当天"到达+离开"拟合
  const deptShifts = getDeptShifts(dept);
  const sourceShifts = (deptShifts && deptShifts.length) ? deptShifts : UNIVERSAL_SHIFTS;
  return inferDayShiftBySpan(times, sourceShifts);
}

// 计算某员工整月的基准班次集合（返回部门配置或 UNIVERSAL_SHIFTS 中匹配的对象数组）
function computeEmployeeBaseShifts(emp, processedDays) {
  const dept = emp.dept;
  // 保安/卫生组固定 06:30/16:00，不参与推断，保持原有逻辑
  if (dept && (dept.includes('保安') || dept.includes('卫生'))) return [];
  const dhLen = (typeof dateHeaders !== 'undefined' && dateHeaders) ? dateHeaders.length : processedDays.length;
  const dayCount = Math.min(dhLen, processedDays.length);
  const snap = {};   // startStr -> 出现天数（供 employeeLateBaseStart 兜底用）
  const variantCount = {}; // "start|end" -> 出现天数（用于在同一起点内选出现最多的变体：半天/全天自动选对）
  const firstMins = [];   // 每个工作日的首卡分钟数（用于算中位数）
  let workdays = 0;
  // 部门有配置时，基准班次只能从部门班次里选，避免通用班次污染
  const deptShifts = getDeptShifts(dept);
  const allowedStarts = (deptShifts && deptShifts.length) ? [...new Set(deptShifts.map(s => s.start))] : null;
  const sourceShifts = (deptShifts && deptShifts.length) ? deptShifts : UNIVERSAL_SHIFTS;
  for (let i = 0; i < dayCount; i++) {
    const ts = processedDays[i];
    if (!ts || ts.trim() === '' || ts.trim() === '-') continue;
    const times = dedupTimes(parseTimes(ts));
    if (!times.length) continue;
    const cls = classifyPunchTimes(times);
    let fMin = null;
    if (cls.morning_start.length) fMin = timeToMin(cls.morning_start[0]);
    else {
      const nt = times.filter(t => t.h >= 6);
      if (nt.length) fMin = timeToMin(nt[0]);
    }
    if (fMin === null) continue;
    workdays++;
    firstMins.push(fMin);
    // 2026-08-19 修复(CAM 06:30 班)：用"到达+离开"双重拟合选最贴合班次起点，
    // 避免早到轻罚把"06:30 班、偶尔 7 点后才到"的员工误吸到 07:00 基准(致 16:01 误判早退)。
    let dayShift = inferDayShiftBySpan(times, sourceShifts);
    if (!dayShift) {
      const sStr = snapStartEarlyBias(fMin, allowedStarts);
      if (sStr) dayShift = sourceShifts.find(s => s.start === sStr) || null;
    }
    if (dayShift) {
      snap[dayShift.start] = (snap[dayShift.start] || 0) + 1;
      const vkey = dayShift.start + '|' + dayShift.end;
      variantCount[vkey] = (variantCount[vkey] || 0) + 1;
    }
  }
  if (!workdays) return [];
  const entries = Object.entries(snap).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return [];
  const dom = entries[0];
  const threshold = Math.max(2, Math.floor(workdays * 0.25));
  const baseStarts = new Set();
  baseStarts.add(dom[0]);
  for (let k = 1; k < entries.length; k++) {
    if (entries[k][1] >= threshold) baseStarts.add(entries[k][0]);
  }
  // 结果对象：每个选中的起点，取该起点下出现最多的变体（半天/全天自动选对，避免把全天班员工误挂到半天班）
  const result = [];
  for (const st of baseStarts) {
    let bestKey = null, bestC = -1;
    for (const key in variantCount) {
      if (key.split('|')[0] === st && variantCount[key] > bestC) { bestC = variantCount[key]; bestKey = key; }
    }
    if (bestKey) {
      const [s, e] = bestKey.split('|');
      const sh = sourceShifts.find(x => x.start === s && x.end === e);
      if (sh) result.push(sh);
    }
  }
  emp._baseSnap = snap;       // 各起点出现天数（供 employeeLateBaseStart 兜底）
  emp._firstMins = firstMins; // 首卡分钟数（用于中位数基准）
  emp._allowedStarts = allowedStarts; // 供 employeeLateBaseStart 兜底用
  return result;
}

// 迟到判定的基准起点（兜底用；主路径已优先用"当天匹配班次的 start"，见 processEmployee）：
//  - 多簇（远距不同班次，如 08:00 与 09:00、08:00 与 13:30，间隔>45分钟）：按当天首卡就近归入对应簇，取该簇众数起点。
//    避免把 8:57 误判为 8:00 班迟到（8:00 主班、偶尔几天 9:00 班 → 分簇后 8:57 归 09:00 簇）。
//  - 单簇（相邻起点，如 07:30/08:00，间隔<=45分钟）：用该员工首卡「中位数 + 早到轻罚」确定唯一参考起点。
//    中位数体现其真实到岗中心；早到轻罚贯彻"早到概率＞迟到概率"——整月偏早于 8:00 的早到鸟判为 8:00 班不误伤，
//    而整月准点 7:30、仅个别天滑到 7:40 的人，中位数贴近 7:30，该天被精准标红。
// 这样既准确区分早到/迟到，又不伤及无辜。
function employeeLateBaseStart(emp, fMin) {
  const snap = emp && emp._baseSnap;
  if (!snap || !Object.keys(snap).length) return null;
  const starts = Object.keys(snap).sort((a, b) => parseShiftTime(a) - parseShiftTime(b));
  // 按间隔聚类：相邻 <= 45 分钟归同一簇（7:30/8:00 合并；8:00/9:00 相隔 60 分钟 → 分簇）
  const clusters = [];
  let cur = [starts[0]];
  for (let i = 1; i < starts.length; i++) {
    if (parseShiftTime(starts[i]) - parseShiftTime(starts[i - 1]) <= 45) cur.push(starts[i]);
    else { clusters.push(cur); cur = [starts[i]]; }
  }
  clusters.push(cur);
  if (clusters.length === 1) {
    // 单簇：用首卡中位数 + 早到轻罚 映射出参考起点（贯彻早到优先）
    const meds = emp._firstMins;
    if (meds && meds.length) {
      const sorted = [...meds].sort((a, b) => a - b);
      const med = sorted[Math.floor(sorted.length / 2)];
      return snapStartEarlyBias(med, emp._allowedStarts || null);
    }
    let rep = cur[0], repC = -1;
    for (const s of cur) if (snap[s] > repC) { repC = snap[s]; rep = s; }
    return rep;
  }
  // 多簇：按首卡就近归入对应簇，取该簇众数起点
  let bestStart = null, bestD = Infinity;
  for (const cl of clusters) {
    let rep = cl[0], repC = -1;
    for (const s of cl) if (snap[s] > repC) { repC = snap[s]; rep = s; }
    const d = Math.abs(fMin - parseShiftTime(rep));
    if (d < bestD) { bestD = d; bestStart = rep; }
  }
  return bestStart;
}

// 打卡分类
// 2026-08-23 早餐豁免：仅下列 6 个部门、且上 6:30 早班的人，可在 7:50-8:00 外出买早餐。
// 关键区分：这 6 个部门里既有 6:30 早班人、也有 8:00 班的人。
//   - 6:30 早班人：存在早于早餐窗口的上午到岗卡（约 ≤7:30，表明是 6:30 班）→ 适用早餐规则；
//   - 8:00 班的人：仅近 8 点打 1 次卡（如 7:42）→ 视为正常到岗上 8:00 班，不适用早餐规则、不计缺卡。
// 早餐窗口 7:50-8:00（含两端）内，对 6:30 早班人：
//   ≥2 张（出去+回来）：剔除，正常上班，无缺卡；
//   1 张（只打了出去/回来其一）：剔除，但记 1 次缺卡（标记红色）；
//   0 张：没出去买早餐，正常上班。
// 剔除窗口卡是为避免其被误判为首卡/末卡；单卡情况额外记 1 次缺卡（买早餐另一张卡）。
const BREAKFAST_EXEMPT_DEPTS = new Set([
  "CAM-打印组（B栋）", "CAM-模型打印（4楼）", "CAM-模型打印（C栋）",
  "CAM-氧化锆切削（4楼）", "CAM-氧化锆切削（C栋）", "金属切削组（C栋）"
]);
function stripBreakfastTimes(times, dept) {
  let breakfastMissing = false;
  if (!dept || !BREAKFAST_EXEMPT_DEPTS.has(dept)) return {times, breakfastMissing};
  // 仅对「6:30 早班人」适用早餐规则：需存在早于 7:30 的上午到岗卡（否则视为 8:00 班的人，正常到岗）
  const morning = times.filter(t => { const m = timeToMin(t); return m >= 5*60 && m < 12*60; });
  if (!morning.length) return {times, breakfastMissing}; // 无上午卡，谈不上早餐
  const earliest = morning.reduce((a, b) => timeToMin(a) <= timeToMin(b) ? a : b);
  const is630Worker = timeToMin(earliest) < 7*60+30;
  if (!is630Worker) return {times, breakfastMissing}; // 8:00 班的人：正常按 8:00 班次处理，不触发早餐规则
  const inWin = (t) => { const m = timeToMin(t); return m >= 7*60+50 && m <= 8*60; };
  const win = times.filter(inWin);
  if (win.length === 0) return {times, breakfastMissing}; // 6:30 早班人但没买早餐，正常
  // 1 张或 ≥2 张都从序列剔除；仅 1 张时记 1 次缺卡（另一张卡未打）
  breakfastMissing = (win.length === 1);
  return {times: times.filter(t => !inWin(t)), breakfastMissing};
}

function classifyPunchTimes(times) {
  const result = {morning_start:[], noon_end:[], afternoon_start:[], afternoon_end:[], overtime_start:[], overtime_end:[]};
  if (!times.length) return result;

  const hasNormal = times.some(t => t.h >= 5);
  const midnightIndices = new Set();
  if (hasNormal) {
    for (let i = times.length - 1; i >= 0; i--) {
      if (times[i].h < 5) midnightIndices.add(i);
      else break;
    }
  }

  const noonBuffer = [];
  for (let idx = 0; idx < times.length; idx++) {
    const t = times[idx];
    const tm = timeToMin(t);
    if (midnightIndices.has(idx)) { result.overtime_end.push(t); continue; }
    if (tm < 12 * 60) { result.morning_start.push(t); }
    else if (tm < 13 * 60 + 30) { noonBuffer.push({idx, t}); }
    else if (tm < 17 * 60 + 30) { result.afternoon_start.push(t); }
    // 17:30-18:00 先统一归 afternoon_end；是否为"加班上班卡(overtime_start)"由下方双打卡逻辑按间隔再拆。
    // 单打卡时一律视为下午下班卡（不应在没有下班卡的情况下单独出现"加班上班卡"）。
    else if (tm < 18 * 60) { result.afternoon_end.push(t); }
    else { result.overtime_end.push(t); }
  }

  noonBuffer.sort((a,b) => a.idx - b.idx);
  const gapFlags = [false];
  for (let i = 1; i < noonBuffer.length; i++) {
    gapFlags.push(timeToMin(noonBuffer[i].t) - timeToMin(noonBuffer[i-1].t) >= 15);
  }
  let noonCount = 0;
  for (let i = 0; i < noonBuffer.length; i++) {
    const {t} = noonBuffer[i];
    const tm = timeToMin(t);
    if (tm >= 13 * 60 + 15) { result.afternoon_start.push(t); }
    else if (tm < 12 * 60 + 30) {
      if (gapFlags[i] && noonCount > 0) result.afternoon_start.push(t);
      else { result.noon_end.push(t); noonCount++; }
    } else {
      if (noonCount > 0) { result.afternoon_start.push(t); }
      else if (i + 1 < noonBuffer.length) { result.noon_end.push(t); noonCount++; }
      else result.afternoon_start.push(t);
    }
  }
  // 2026-08-14 修正（其五）：只打 1 次晚间卡 = 不加班。
  // 若当天 17:30 之后只打了 1 次卡（例如 18:00、18:20，甚至 19:00/22:00），
  // 无论几点，一律视为「下午下班卡(afternoon_end)」，不计入 overtime_end、不算加班。
  // 依据：用户明确「只打 1 次卡 = 不加班」——没有「下班后再回来加班」的二次打卡证据，
  //       不应凭单张卡臆测加班。加班需有晚走的多张卡（含 17:30-18:00 双打卡）支撑。
  // 例外：若当天存在跨天凌晨卡(h<5)，说明是真正的夜班/通宵，则不强行覆盖（保留既有逻辑）。
  const hasMidnightPunch = result.overtime_end.some(t => t.h < 5);
  const eveningSameDay = [...result.afternoon_end, ...result.overtime_end]
    .filter(t => t.h >= 5 && timeToMin(t) >= 17*60+30);
  if (!hasMidnightPunch && eveningSameDay.length === 1) {
    result.afternoon_end = [eveningSameDay[0]];
    result.overtime_end = result.overtime_end.filter(t => t.h < 5); // 仅保留跨天凌晨卡（本分支已排除）
  }

  // 17:30-18:00 双打卡处理（2026-08-14）：
  // 单打卡：已在上面统一归 afternoon_end（一律视为下午下班卡，不存在"单独一张加班上班卡"的情形）。
  // 该区间若打 2 次及以上卡，且相邻最大间隔 >= 5 分钟 → 视为「下午下班卡 + 晚上加班上班卡」：
  //   间隔之前的归 afternoon_end（下班），间隔之后的归 overtime_start（加班上班）。
  // 若相邻间隔均 < 5 分钟 → 视为重复打卡，合并为一张（保留最早一张，归 afternoon_end）。
  const getoff = [...result.afternoon_end, ...result.overtime_start]
    .filter(t => { const m = timeToMin(t); return m >= 17*60+30 && m < 18*60; })
    .sort((a,b)=>timeToMin(a)-timeToMin(b));
  if (getoff.length >= 2) {
    let maxGap = 0, splitIdx = 1;
    for (let i = 1; i < getoff.length; i++) {
      const g = timeToMin(getoff[i]) - timeToMin(getoff[i-1]);
      if (g > maxGap) { maxGap = g; splitIdx = i; }
    }
    if (maxGap >= 5) {
      result.afternoon_end = getoff.slice(0, splitIdx);
      result.overtime_start = getoff.slice(splitIdx);
    } else {
      result.afternoon_end = [getoff[0]];
      result.overtime_start = [];
    }
  }
  for (const k of Object.keys(result)) result[k].sort((a,b) => timeToMin(a)-timeToMin(b));
  return result;
}

function adjustClassified(cls, dept, times) {
  if (!cls.afternoon_end.length && cls.afternoon_start.length) {
    const last = cls.afternoon_start[cls.afternoon_start.length-1];
    if (timeToMin(last) >= 16*60) {
      cls.afternoon_end = [last];
      cls.afternoon_start = cls.afternoon_start.slice(0,-1);
    }
  }
  if (!cls.afternoon_end.length && !cls.overtime_start.length && cls.afternoon_start.length && times) {
    const normal = times.filter(t=>t.h>=6).sort((a,b)=>timeToMin(a)-timeToMin(b));
    if (normal.length) {
      const last = normal[normal.length-1];
      const lm = timeToMin(last);
      // 2026-08-16 修复：仅当该卡贴近「匹配班次的正常下班时间」时才当作下午下班卡，
      // 否则（如 7:00-16:30 班次的人 13:30 就走了、或标准班 14:00 早退）应判定为缺下午下班卡，而非误判已正常下班。
      // 兜底：无班次信息时沿用原 [13:30,17:30) 窗口。
      let endOk = (lm >= 13*60+30 && lm < 17*60+30);
      const adj = getBestShift(times, dept);
      if (adj && adj.end) {
        const se = parseShiftTime(adj.end);
        if (se !== null) {
          const seMin = se <= 30 ? se + 24*60 : se;   // 跨天班次 end 归次日
          endOk = (lm >= seMin - 60 && lm <= seMin + 30);
        }
      }
      if (endOk) {
        cls.afternoon_end = [last];
        cls.afternoon_start = cls.afternoon_start.slice(0,-1);
      }
    }
  }
  if (!cls.afternoon_end.length && !cls.overtime_end.length && cls.overtime_start.length) {
    cls.afternoon_end = [cls.overtime_start[cls.overtime_start.length-1]];
    cls.overtime_start = cls.overtime_start.slice(0,-1);
  }
  // 与班次下班时间对齐（2026-08-16 修复）：
  // 当最晚一张 overtime_end 卡紧贴班次「正常下班时间(ot_base)」时，它其实是「下午下班卡(afternoon_end)」而非加班。
  // 例：半天 14:00-18:00，13:23 上班、18:15 下班 → 18:15 应为 afternoon_end，不算加班、不判缺卡。
  // 窗口规则：
  //  - 早班（ot_base<=18:00，如 16:30/17:30 等）：沿用原「下班可晚到 60 分」宽松窗口，避免把 18:15 这类迟到下班误判为加班。
  //  - 晚班/跨天班（ot_base>18:00 或 00:xx，如 22:00/23:30/00:30）：收紧到 ±30 分，
  //    避免把真正的深夜加班（23:00 / 01:00 等）误判为下班。
  //    （CAM-打印组 B栋 的 13:30-22:00、16:00-00:30 班次尤其依赖此收紧：22:00 下班、23:00 才是真实加班。）
  const adjShift = getBestShift(times, dept);
  if (adjShift) {
    const obRaw = parseShiftTime(adjShift.ot_base != null ? adjShift.ot_base : adjShift.end);
    if (obRaw !== null) {
      const obMin = obRaw <= 30 ? obRaw + 24 * 60 : obRaw;   // 跨天 ot_base(00:30) → 次日 24:30
      const lo = obMin - 30;
      const hi = obMin <= 18 * 60 ? obMin + 60 : obMin + 30; // 早班宽松(+60)，晚班/跨天收紧(+30)
      if (cls.overtime_end.length) {
        const sortedOt = [...cls.overtime_end].sort((a,b)=>timeToMin(a)-timeToMin(b));
        const lastOt = sortedOt[sortedOt.length-1];
        let lm = timeToMin(lastOt);
        if (lastOt.h < 5) lm += 24*60; // 跨天凌晨卡归次日
        if (lm >= lo && lm <= hi) {
          cls.afternoon_end = [lastOt];
          cls.overtime_end = sortedOt.slice(0, -1);
        }
      }
    }
  }

  // 单张晚间卡 → 加班判定（2026-08-16 修正，对"其五=只打1次卡不加班"的精细化）：
  // 当前 cls 中 17:30 之后只有 1 张同天卡（已在前面"单卡规则"中被归为 afternoon_end），
  // 若其时间 >=「班次加班起算点 + 60 分钟」，说明是真实加班下班卡，晋升为 overtime_end 并计加班；
  // 否则维持 afternoon_end（正常下班，不加班、不判缺卡）。
  // 门槛相对班次加班起算点（getOvertimeStartMin）：
  //   - 白班(ot_base<=18:00，含标准 17:30)：18:00 起算 → 需 >= 19:00
  //   - 9点班(ot_base=19:00)：19:00 起算 → 需 >= 20:00
  //   - 夜班(ot_base=00:30，跨天)：次日 00:30 起算 → 需 >= 01:30
  // 仅对"同天卡(h>=5)"生效；跨天凌晨卡(h<5)走既有逻辑，不受此块影响。
  {
    const s2 = getBestShift(times, dept);
    const singleEvening = [...cls.afternoon_end, ...cls.overtime_end]
      .filter(t => { const m = timeToMin(t); return t.h >= 5 && m >= 17*60+30; })
      .sort((a,b)=>timeToMin(a)-timeToMin(b));
    if (s2 && singleEvening.length === 1 && !cls.overtime_start.length) {
      const card = singleEvening[0];
      const cardMin = timeToMin(card);
      const otStart = getOvertimeStartMin(s2);
      if (cardMin >= otStart + 60) {
        cls.overtime_end = [card];
        cls.afternoon_end = cls.afternoon_end.filter(t => t !== card);
      }
    }
  }

  return cls;
}

// 推断缺失的上午上班时间（前后天参考）
function endMinOf(s){ const e = parseShiftTime(s.end); return e <= 30 ? e + 24*60 : e; }
function punchMinOf(t){ return (t.h < 5) ? t.h*60 + t.m + 24*60 : t.h*60 + t.m; }
function getAnchorFromTimes(ts, dept) {
  const t = dedupTimes(parseTimes(ts));
  if (!t.length) return null;
  const cls = classifyPunchTimes(t);
  if (cls.morning_start.length) return timeToMin(cls.morning_start[0]);
  const nt = t.filter(x => x.h >= 6);
  return nt.length ? timeToMin(nt[0]) : null;
}
function inferNeighborStart(dayIdx, processedDays, dept) {
  const tryDay = (i) => {
    if (i < 0 || i >= processedDays.length) return null;
    const ts = processedDays[i];
    if (!ts || ts.trim() === '' || ts.trim() === '-') return null;
    return getAnchorFromTimes(ts, dept);
  };
  const a = tryDay(dayIdx - 1);
  if (a !== null) return a;
  return tryDay(dayIdx + 1);
}
function inferMissingMorningStart(dayIdx, processedDays, dept) {
  function getMorning(idx) {
    if (idx < 0 || idx >= processedDays.length) return null;
    const ts = processedDays[idx];
    if (!ts || ts.trim() === '' || ts.trim() === '-') return null;
    let times = parseTimes(ts);
    times = dedupTimes(times);
    const cls = classifyPunchTimes(times);
    if (cls.morning_start.length) {
      return getShiftStartFromDept(times, dept);
    }
    return null;
  }
  return getMorning(dayIdx-1) || getMorning(dayIdx+1);
}

// 计算加班的起算时间（分钟）
// 规则：
//  - 加班从 ot_base（班次正常下班时间）之后算起
//  - 若 ot_base 在 18:00 之前（含标准白班 17:30），统一从 18:00 起（17:30-18:00 为全员晚餐休息，不算加班）
//  - 跨天班次（ot_base 在 00:00 附近，即 <=30 分，如 00:30）按次日处理
function getOvertimeStartMin(shift) {
  if (!shift || !shift.ot_base) return 18 * 60;
  const ob = parseShiftTime(shift.ot_base);
  if (ob === null) return 18 * 60;
  if (ob <= 30) return ob + 24 * 60;          // 跨天：00:30 → 次日 24:30
  return Math.max(ob, 18 * 60);               // 白班统一 18:00；晚班（19:00/20:00/22:00/23:30 等）用 ot_base
}

// 计算加班工时（小时）
// 取「真实时间最晚」的加班卡（凌晨卡 h<5 视为次日 +24h），从 ot_base 起算
// 白班（ot_base <=18:00，含标准 17:30）统一 18:00 起（17:30-18:00 为全员晚餐休息）
function computeOvertimeHours(cls, matchedShift) {
  if (!cls.overtime_end.length) return 0;
  let bestMin = -1;
  for (const t of cls.overtime_end) {
    let tm = timeToMin(t);
    if (t.h < 5) tm += 24 * 60;               // 跨天凌晨卡归次日
    if (tm > bestMin) bestMin = tm;
  }
  const otStartMin = getOvertimeStartMin(matchedShift);
  const nightMin = bestMin - otStartMin;
  return nightMin > 0 ? nightMin / 60 : 0;
}

// 计算全天工时
function calculateAllHours(times, dept, dayIdx, processedDays) {
  if (!times.length) return {morning:0, afternoon:0, night:0, total:0};
  const midCutoff = (dept.includes('保安') || dept.includes('卫生')) ? 5 : 6;
  const midnightCards = times.filter(t=>t.h<midCutoff);
  const normalCards = times.filter(t=>t.h>=midCutoff);
  if (midnightCards.length && !normalCards.length) return {morning:0, afternoon:0, night:0, total:0};

  const hasMorningCard = times.some(t=>t.h>=midCutoff && t.h<12);
  const hasAfternoonCard = times.some(t=>t.h>=13);

  // 只有下午/晚上（无上午卡）→ 用班次推断计算
  if (hasAfternoonCard && !hasMorningCard) {
    const nc = times.filter(t=>t.h>=6).sort((a,b)=>timeToMin(a)-timeToMin(b));
    if (!nc.length) return {morning:0, afternoon:0, night:0, total:0};
    const firstMin = timeToMin(nc[0]);
    let lastMin = timeToMin(nc[nc.length-1]);
    if (midnightCards.length) lastMin = 24*60 + timeToMin(midnightCards[midnightCards.length-1]);

    // 用班次推断来计算工时
    const matchedShift = getBestShift(times, dept, dayIdx, processedDays);
    let totalH = 0;

    if (matchedShift) {
      const sStart = parseShiftTime(matchedShift.start);
      const netH = matchedShift.net_h || 8;

      if (netH <= 5) {
        // 半天班：工时 = 第一张卡到班次下班时间（net_h小时）
        // 但不超过实际打卡时间跨度
        const sEnd = parseShiftTime(matchedShift.end);
        let endMin = sEnd <= 30 ? sEnd + 24*60 : sEnd; // 跨天处理
        if (endMin <= sStart) endMin += 24*60; // 防止endMin < sStart
        totalH = Math.min(netH, (lastMin - firstMin) / 60);
        if (totalH < 0) totalH = 0;
      } else {
        // 全天班：工时 = min(实际跨度, 班次净工时)
        const elapsed = (lastMin - firstMin) / 60;
        totalH = Math.min(netH, elapsed);
        if (totalH < 0) totalH = 0;
      }
    } else {
      // 无班次匹配兜底：按实际打卡跨度计算
      totalH = (lastMin - firstMin) / 60;
      if (totalH < 0) totalH = 0;
    }
    // 加班：从 ot_base（班次正常下班）之后算起（与主线一致）
    const cls2 = classifyPunchTimes(times);
    const nightH = computeOvertimeHours(cls2, matchedShift);
    return {morning:0, afternoon:totalH, night:nightH, total:totalH + nightH};
  }

  // 正常（有上午卡）
  let cls = classifyPunchTimes(times);
  cls = adjustClassified(cls, dept, times);

  let mornHours=0, afHours=0, nightHours=0;

  // 推断上班时间 & 获取班次配置
  let morningStart = null;
  let matchedShift = null;
  if (cls.morning_start.length) {
    morningStart = getShiftStartFromDept(times, dept);
    matchedShift = getBestShift(times, dept, dayIdx, processedDays);
  } else if (cls.noon_end.length && dayIdx !== undefined && processedDays) {
    morningStart = inferMissingMorningStart(dayIdx, processedDays, dept);
  }
  // 缺上午上班卡但有noon_end：用noon_end反推（默认上午工作4h）
  // 有noon_end说明上午来了，只是没打卡，不应算成半天
  if (!morningStart && cls.noon_end.length) {
    const best = getBestShift(times, dept, dayIdx, processedDays);
    if (best) {
      const [h, m] = best.start.split(':').map(Number);
      morningStart = {h, m};
      matchedShift = best;
    } else {
      // 无班次匹配，用noon_end反推4h
      const noonEnd = cls.noon_end[0];
      let inferredMin = timeToMin(noonEnd) - 4 * 60;
      if (inferredMin < 6 * 60) inferredMin = 7 * 60; // 不早于7:00
      morningStart = {h: Math.floor(inferredMin / 60), m: inferredMin % 60};
    }
  }

  // 上午工时
  if (morningStart) {
    const noonCutoff = dept.includes('保安') ? {h:11,m:50} : {h:12,m:0};
    let mornEndMin = timeToMin(noonCutoff); // 默认算到12:00

    // 如果有下午卡（afternoon_start/end或overtime），说明全天班，上午到12:00
    const hasAnyAfternoon = cls.afternoon_start.length || cls.afternoon_end.length || cls.overtime_start.length || cls.overtime_end.length;
    if (!cls.noon_end.length && !hasAnyAfternoon) {
      // 没有noon_end也没有任何下午卡 → 可能是半天班（只有上午）
      // 用最后一张morning_start卡作为上午实际截止
      if (cls.morning_start.length) {
        const lastMorn = cls.morning_start[cls.morning_start.length - 1];
        mornEndMin = Math.min(timeToMin(noonCutoff), timeToMin(lastMorn));
      }
    }

    // 起算点 = max(morningStart, 第一张上午卡)：迟到时段不算工时
    let mornStartMin = timeToMin(morningStart);
    if (cls.morning_start.length) {
      const firstMornCardMin = timeToMin(cls.morning_start[0]);
      mornStartMin = Math.max(mornStartMin, firstMornCardMin);
    }

    const mornMin = mornEndMin - mornStartMin;
    if (mornMin > 0) mornHours = mornMin / 60;
  }

  // 下午工时（用班次正常下班时间）
  const hasAfWork = cls.afternoon_end.length || cls.overtime_start.length || cls.overtime_end.length || cls.afternoon_start.length;
  if (hasAfWork) {
    const afStart = {h:13, m:30};
    let normalEndTime = {h:17, m:30};
    if (morningStart) {
      if (morningStart.h === 6 && morningStart.m === 30) normalEndTime = {h:16, m:0};
      else if (morningStart.h === 7 && morningStart.m === 0) normalEndTime = {h:16, m:30};
      else if (morningStart.h === 7 && morningStart.m === 30) normalEndTime = {h:17, m:0};
      else if (morningStart.h === 9) normalEndTime = {h:19, m:0};
      else if (morningStart.h === 10) normalEndTime = {h:20, m:0};
      else if (morningStart.h === 13) normalEndTime = {h:22, m:0};
      else if (morningStart.h === 15) normalEndTime = {h:23, m:30};
    }
    const hasOT = cls.overtime_end.length > 0;
    let afEnd;
    if (hasOT) {
      afEnd = normalEndTime;
    } else if (cls.overtime_start.length && !cls.overtime_end.length) {
      afEnd = normalEndTime;
    } else if (cls.afternoon_end.length) {
      afEnd = cls.afternoon_end[cls.afternoon_end.length-1];
      if (timeToMin(afEnd) > timeToMin(normalEndTime)) afEnd = normalEndTime;
    } else if (cls.afternoon_start.length) {
      afEnd = normalEndTime;
    } else {
      afEnd = normalEndTime;
    }
    let afMin = timeToMin(afEnd) - timeToMin(afStart);
    // 根据班次配置的break_min扣除下午休息时间（如9:00/10:00班break_min=30）
    // 8:00班break_min=0则不扣，12:00-13:30的1.5h已在起算点自然扣除
    const breakMin = (matchedShift && matchedShift.break_min) ? matchedShift.break_min : 0;
    if (breakMin > 0 && afMin >= breakMin) afMin -= breakMin;
    if (afMin > 0) afHours = afMin / 60;
  }

  // 晚上加班工时：从 ot_base（班次正常下班）之后算起
  if (cls.overtime_end.length) {
    nightHours = computeOvertimeHours(cls, matchedShift);
  }

  const total = mornHours + afHours + nightHours;
  return {morning: mornHours, afternoon: afHours, night: nightHours, total};
}

// 出勤+加班计算
// 设计原则（2026-08-14）：
//  - 出勤天数以「匹配到的班次(全天/半天)」为基线，迟到/早退是独立标记，不撼动天数
//  - 加班直接按「ot_base → 最晚卡」计算，不与迟到做净额抵消
function calcShiftAndOvertime(times, dept, dayIdx, processedDays) {
  const noOt = dept.includes('保安') || dept.includes('卫生');
  if (noOt) {
    return {attendanceDays: times.length ? 1 : 0, paidDays: times.length ? 1 : 0, overtimeHours: 0, halfDay: false};
  }
  if (!times.length) return {attendanceDays:0, paidDays:0, overtimeHours:0, halfDay:false};

  // 出勤天数：取匹配班次的 day_val（全天=1 / 半天=0.5）；无法匹配时用打卡分布兜底
  const matchedShift = getBestShift(times, dept, dayIdx, processedDays);
  let attendanceDays;
  if (matchedShift && typeof matchedShift.day_val === 'number') {
    attendanceDays = matchedShift.day_val;
  } else {
    const hasM = times.some(t => t.h >= 6 && t.h < 12);
    const hasA = times.some(t => t.h >= 13);
    if (hasM && hasA) attendanceDays = 1;
    else if (hasM || hasA) attendanceDays = 0.5;
    else attendanceDays = 0;
  }

  // 加班：直接用 calculateAllHours 的 night 段（= ot_base → 最晚卡），迟到不抵消
  const {night: overtimeRaw} = calculateAllHours(times, dept, dayIdx, processedDays);
  let overtimeHours = 0;
  if (overtimeRaw > 0) {
    const ot = Math.floor(overtimeRaw * 2) * 0.5;
    if (ot >= 1) overtimeHours = ot;
  }

  // 加班≥4h 优先抵有薪天数（避免"0.5天+4h加班"），但加班本身仍按实际计
  let paidDays = attendanceDays;
  if (overtimeHours > 0) {
    const needed = 1 - paidDays;
    if (needed > 0) {
      let maxConvert = Math.floor(overtimeHours / 4) * 0.5;
      if (maxConvert > needed) maxConvert = needed;
      paidDays += maxConvert;
    }
  }

  const halfDay = (attendanceDays === 0.5);

  return {attendanceDays, paidDays, overtimeHours, halfDay};
}

// 缺卡计算
function calcMissingCards(times, dept) {
  if (!times.length) return {count:0, types:[]};
  // 保安/保洁：不计算缺卡（不标红、不标记缺卡）
  if (dept.includes('保安') || dept.includes('卫生')) return {count:0, types:[]};

  // 保安/卫生组06:30上班，05:xx可能是早到，不算凌晨卡
  const midCutoff = (dept.includes('保安') || dept.includes('卫生')) ? 5 : 6;
  const midnight = times.filter(t=>t.h<midCutoff);
  let normal = times.filter(t=>t.h>=midCutoff);
  if (midnight.length && !normal.length) return {count:0, types:[]};
  if (midnight.length && normal.length) times = normal;
  normal = times.filter(t=>t.h>=midCutoff);
  if (!normal.length) return {count:0, types:[]};

  const hasAfCard = normal.some(t=>t.h>=13);
  const hasMornCard = normal.some(t=>t.h>=6 && t.h<13);
  if (!hasMornCard && !hasAfCard) return {count:0, types:[]};

  let count=0, types=[];
  if (hasAfCard) {
    let cls = classifyPunchTimes(times);
    cls = adjustClassified(cls, dept, times);
    const hasMornStart = cls.morning_start.length > 0;
    const hasNoonEnd = cls.noon_end.length > 0;
    const hasAfStart = cls.afternoon_start.length > 0;
    const hasAfEnd = cls.afternoon_end.length > 0;
    const hasOtEnd = cls.overtime_end.length > 0;
    const hasNoonArr = normal.some(t => {const m=timeToMin(t); return m>=12*60+30 && m<13*60+30;});

    if (hasMornStart || hasNoonEnd) {
      if (!hasMornStart) { count++; types.push('morning_start'); }
      if (!hasNoonEnd) { count++; types.push('noon_end'); }
    }
    const hasAfWork = hasAfStart || hasAfEnd || hasOtEnd;
    if (hasAfWork) {
      // 缺afternoon_start：没有afternoon_start也没有午到(12:30-13:30)卡
      // 2026-08-16 修复：原代码错误地加了 !hasAfEnd && !overtime_start 条件，
      // 导致"有下班卡却缺上班卡"(如 08:20/12:27/17:32 缺 13:30 上班卡)被漏判。
      // 有 afternoon_end/overtime_start/overtime_end 恰恰证明下午来了，更该判缺 afternoon_start。
      if (!hasAfStart && !hasNoonArr) { count++; types.push('afternoon_start'); }
      if (!hasAfEnd && !cls.overtime_start.length) { count++; types.push('afternoon_end'); }
    }
    // 2026-08-14 修正（其二）：常规加班（已打「下午下班卡 afternoon_end」+「加班下班卡 overtime_end」）
    // 不再把 overtime_start（17:50-18:00 的"加班上班卡"）当作必打卡点——绝大多数加班员工并不单独打这张边界卡。
    // 2026-08-16 精细化：但当「只有 1 张同天晚间卡且已晋升为 overtime_end、同时没有 afternoon_end」时
    // （即单卡超时下班场景，如 08:00 / 12:03 / 12:34 / 19:00，19:00 距 18:00 加班起算满 1h → 算加班 1h），
    // 此时既没有正常下班打卡、也没有加班上班打卡，应判 2 次缺卡：下午下班卡 + 加班上班卡。
    // 仅当 overtime_end 中存在"同天卡(h>=5)"时才适用，避免误伤真正跨天夜班（其加班卡为凌晨 h<5，本无下午/加班边界卡概念）。
    const hasSameDayOt = cls.overtime_end.some(t => t.h >= 5);
    if (hasOtEnd && hasSameDayOt && !cls.overtime_start.length && !hasAfEnd) { count++; types.push('overtime_start'); }
  } else if (hasMornCard) {
    const mornCards = normal.filter(t=>t.h<13);
    if (mornCards.length >= 2) {}
    else {
      if (mornCards[0].h >= 10) { count++; types.push('morning_start'); }
      else { count++; types.push('noon_end'); }
    }
  }
  return {count, types};
}

// 凌晨卡跨天处理
function preprocessCrossMidnight(empDays, dept) {
  const processed = [...empDays];
  const isWeisheng = dept && dept.includes('卫生');
  const midCutoff = isWeisheng ? 5 : 6;
  // 首日凌晨卡处理
  if (processed.length && processed[0]) {
    const day0Times = parseTimes(processed[0]);
    const midnights = day0Times.filter(t=>t.h<midCutoff);
    const normals = day0Times.filter(t=>t.h>=midCutoff);
    if (midnights.length && normals.length) {
      processed[0] = normals.sort((a,b)=>timeToMin(a)-timeToMin(b)).map(t=>`${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`).join('\n');
    }
  }
  // 铁律（2026-08-19）：凌晨打卡(h<midCutoff，如 00:36) 只能是前一工作日的下班卡，
  // 公司绝对没有凌晨上班。因此任何一天的凌晨卡一律上挂到前一天(其所属工作日的起始日)，
  // 不参与当日考勤(不计入当日加班、不作为当日下班卡、不触发当日早退/迟到)。
  for (let d = 1; d < processed.length; d++) {
    const dayTimes = parseTimes(processed[d]);
    if (!dayTimes.length) continue;
    const midnights = dayTimes.filter(t => t.h < midCutoff);
    if (!midnights.length) continue;
    const prevTimes = parseTimes(processed[d-1] || '');
    const newPrev = [...prevTimes, ...midnights].sort((a,b)=>{
      const ka = a.h<midCutoff ? 1440 + timeToMin(a) : timeToMin(a);
      const kb = b.h<midCutoff ? 1440 + timeToMin(b) : timeToMin(b);
      return ka - kb;
    });
    const newToday = dayTimes.filter(t => !(t.h < midCutoff));
    processed[d-1] = newPrev.length ? newPrev.map(t=>`${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`).join('\n') : '';
    processed[d] = newToday.length ? newToday.map(t=>`${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`).join('\n') : '';
  }
  return processed;
}

document.addEventListener('DOMContentLoaded', () => {
  uploadArea = document.getElementById('uploadArea');

  if (!uploadArea) { console.error('uploadArea not found'); return; }

  uploadArea.addEventListener('click', () => fileInput.click());

  // 全局 + uploadArea 都阻止默认拖拽行为
  function preventDrag(e) { e.preventDefault(); e.stopPropagation(); }
  ['dragenter','dragover','dragleave','drop'].forEach(name => {
    document.addEventListener(name, preventDrag);
    uploadArea.addEventListener(name, preventDrag);
  });
  uploadArea.addEventListener('dragenter', () => uploadArea.classList.add('drag-over'));
  uploadArea.addEventListener('dragover', () => uploadArea.classList.add('drag-over'));
  uploadArea.addEventListener('dragleave', e => {
    if (!e.relatedTarget || !uploadArea.contains(e.relatedTarget)) uploadArea.classList.remove('drag-over');
  });
  uploadArea.addEventListener('drop', e => {
    uploadArea.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
});

function fixSheetRef(wb) {
  // 修复得力导出的xlsx文件dimension错误（如4月文件!ref=A1:AI2，实际数据有570行）
  // 策略：遍历所有sheet，用实际行号范围覆盖!ref
  for (const sn of wb.SheetNames) {
    const ws = wb.Sheets[sn];
    if (!ws['!ref']) continue;
    // 找到所有行号（行号=属性名去掉列字母，如A3→3, Z100→100）
    let maxR = 0;
    const refMatch = ws['!ref'].match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/i);
    if (!refMatch) continue;
    const minCol = refMatch[1], minRow = parseInt(refMatch[2]);
    const origMaxCol = refMatch[3], origMaxRow = parseInt(refMatch[4]);
    // 遍历所有cell，找最大行号
    for (const key in ws) {
      if (key[0] === '!') continue;
      const m = key.match(/^([A-Z]+)(\d+)$/);
      if (m) {
        const r = parseInt(m[2]);
        if (r > maxR) maxR = r;
      }
    }
    if (maxR > origMaxRow) {
      ws['!ref'] = minCol + minRow + ':' + origMaxCol + maxR;
      console.log('修复sheet ' + sn + ' !ref: ' + ws['!ref'] + ' (原: ' + minCol + minRow + ':' + origMaxCol + origMaxRow + ')');
    }
  }
}

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    rawWorkbook = XLSX.read(e.target.result, {type:'array', raw:false, cellDates:false, cellText:true, cellNF:false});
    fixSheetRef(rawWorkbook); // 修复dimension错误
    parseExcel();
    document.getElementById('fileInfo').textContent = `✓ 已加载：${file.name}（${employees.length} 名员工，${dateHeaders.length} 天数据）`;
    document.getElementById('fileInfo').classList.remove('hidden');
    document.getElementById('btnProcess').disabled = false;
    logMsg('ok', `文件解析成功：${employees.length} 名员工，${dateHeaders.length} 个日期列`);
  };
  reader.readAsArrayBuffer(file);
}

function parseExcel() {
  const ws = rawWorkbook.Sheets[rawWorkbook.SheetNames[0]];
  // blankrows: true 确保空行不丢失（row2是空行，不能跳过）
  const data = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:'', blankrows:true});

  // ---- 自动检测表头行（row1）和员工数据起始行 ----
  // 得力导出格式：row1=表头(姓名/工号/部门+日期), row2=空行, row3+=员工
  // 但 SheetJS 某些情况下可能跳过空行，所以不能硬编码 i=2
  // 策略：找到第一个col1="姓名"的行作为表头行，之后的非空行作为员工数据

  let headerRowIdx = -1;
  let empStartIdx = -1;
  for (let i = 0; i < data.length; i++) {
    const c0 = String(data[i][0] || '').trim();
    const c1 = String(data[i][1] || '').trim();
    const c2 = String(data[i][2] || '').trim();
    if (c0 === '姓名' && (c1 === '工号' || c2 === '部门' || c1.includes('工号') || c2.includes('部门'))) {
      headerRowIdx = i;
      continue;
    }
    // 表头行之后的第一个有姓名的行就是员工起始行
    if (headerRowIdx >= 0 && empStartIdx < 0 && c0 && c0 !== 'nan' && c0 !== '姓名') {
      empStartIdx = i;
      break;
    }
  }

  if (headerRowIdx < 0) {
    alert('文件格式不对，未找到表头行（姓名/工号/部门）');
    return;
  }
  if (empStartIdx < 0) {
    alert('文件格式不对，未找到员工数据');
    return;
  }

  const headers = data[headerRowIdx];

  // 获取日期列（col4开始），同时确定最大列数（避免空列导致某些员工days长度不一致）
  const rawDateHeaders = [];
  let maxCol = headers.length;
  for (let i = empStartIdx; i < data.length; i++) {
    if (data[i].length > maxCol) maxCol = data[i].length;
  }
  for (let j = 3; j < maxCol; j++) {
    rawDateHeaders.push(String(headers[j] || ''));
  }

  // 过滤掉末尾的空列（得力导出可能保留空列，或导出不全月时后续列为空）
  let trimEnd = rawDateHeaders.length;
  while (trimEnd > 0 && rawDateHeaders[trimEnd - 1].trim() === '') trimEnd--;

  const trimmedHeaders = rawDateHeaders.slice(0, trimEnd);
  if (trimmedHeaders.length === 0) {
    alert('文件格式不对，未找到日期列');
    return;
  }

  // 检测下月1号列：最后一个日期列的月份是否不同于第一个日期列的月份
  let firstMonth = null, lastMonth = null;
  for (const h of trimmedHeaders) {
    const m = h.match(/(\d{1,2})-(\d{1,2})/);
    if (m) {
      if (firstMonth === null) firstMonth = parseInt(m[1]);
      lastMonth = parseInt(m[1]);
    }
  }
  hasNextMonthCol = false;
  if (firstMonth !== null && lastMonth !== null && lastMonth !== firstMonth) {
    hasNextMonthCol = true; // 最后一列是下月1号
  } else if (firstMonth !== null && trimmedHeaders.length >= 2) {
    // 同月份：检查最后一列是否是"01"号（下月1号）
    const lastDate = trimmedHeaders[trimmedHeaders.length - 1];
    const lm = lastDate.match(/(\d{1,2})-(\d{1,2})/);
    if (lm) {
      const lastDay = parseInt(lm[2]);
      const prevDate = trimmedHeaders[trimmedHeaders.length - 2];
      const pm = prevDate.match(/(\d{1,2})-(\d{1,2})/);
      if (pm) {
        const prevDay = parseInt(pm[2]);
        // 如果最后一列是1号，且倒数第二列是28/29/30/31（说明是跨月）
        if (lastDay === 1 && prevDay >= 28) {
          hasNextMonthCol = true;
        }
      }
    }
  }

  // 如果有下月1号列，去掉它（它只用于凌晨卡跨天，不计入出勤/加班/迟到）
  if (hasNextMonthCol) {
    dateHeaders = trimmedHeaders.slice(0, -1);
  } else {
    dateHeaders = trimmedHeaders;
  }

  satSunCols = [];

  // 第一优先：从表头文字中找"周六"/"周日"
  for (let i = 0; i < dateHeaders.length; i++) {
    const h = String(dateHeaders[i]);
    if (h.includes('周六') || h.includes('周日')) satSunCols.push(i);
  }

  // 如果表头没有星期信息，尝试从"MM-DD"格式日期解析出星期
  if (satSunCols.length === 0) {
    let detectedYear = new Date().getFullYear();
    let detectedMonth = null;
    for (let i = 0; i < dateHeaders.length; i++) {
      const h = String(dateHeaders[i]);
      const m = h.match(/(\d{1,2})-(\d{1,2})/);
      if (m) {
        if (!detectedMonth) detectedMonth = parseInt(m[1]);
        const month = parseInt(m[1]);
        const day = parseInt(m[2]);
        const effectiveYear = (detectedMonth && month < detectedMonth) ? detectedYear + 1 : detectedYear;
        try {
          const d = new Date(effectiveYear, month - 1, day);
          const dow = d.getDay();
          if (dow === 0 || dow === 6) satSunCols.push(i);
        } catch(e) {}
      }
    }
  }

  // 如果还是找不到，显示月份补填框，等待用户输入
  if (satSunCols.length === 0) {
    const now = new Date();
    document.getElementById('inputYear').value = now.getFullYear();
    document.getElementById('inputMonth').value = now.getMonth() + 1;
    document.getElementById('monthPickerBox').classList.remove('hidden');
    document.getElementById('monthPickerStatus').textContent = '';
  } else {
    document.getElementById('monthPickerBox').classList.add('hidden');
  }

  employees = [];
  for (let i = empStartIdx; i < data.length; i++) {
    const row = data[i];
    const name = String(row[0]||'').trim();
    if (!name || name === 'nan') continue;
    const days = [];
    for (let j = 3; j < 3 + rawDateHeaders.length; j++) {
      const v = String(row[j]||'').trim();
      days.push(v === 'nan' ? '' : v);
    }
    employees.push({name, id: String(row[1]||'').trim(), dept: String(row[2]||'').trim(), days});
  }

  logMsg('ok', `日期列: ${dateHeaders.length}天${hasNextMonthCol ? ' + 下月1号列' : ''}, 周末列: ${satSunCols.length}个`);
}

function logMsg(type, msg) {
  const div = document.getElementById('logArea');
  const line = document.createElement('div');
  line.className = type === 'ok' ? 'log-ok' : type === 'warn' ? 'log-warn' : 'log-err';
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  div.appendChild(line);
  div.scrollTop = div.scrollHeight;
}

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';

}

// 手动补填月份后，根据年月重新计算周末列
function applyManualMonth() {
  const year = parseInt(document.getElementById('inputYear').value);
  const month = parseInt(document.getElementById('inputMonth').value);
  if (!year || !month || month < 1 || month > 12) {
    document.getElementById('monthPickerStatus').textContent = '请输入有效年月';
    document.getElementById('monthPickerStatus').style.color = '#ff4d4f';
    return;
  }
  // 从dateHeaders中提取每天的日子（MM-DD格式），用指定年月计算星期
  satSunCols = [];
  for (let i = 0; i < dateHeaders.length; i++) {
    const h = String(dateHeaders[i]);
    const m = h.match(/(\d{1,2})-(\d{1,2})/);
    if (m) {
      const day = parseInt(m[2]);
      try {
        const d = new Date(year, month - 1, day);
        const dow = d.getDay(); // 0=周日, 6=周六
        if (dow === 0 || dow === 6) satSunCols.push(i);
      } catch(e) {}
    }
  }
  if (satSunCols.length > 0) {
    document.getElementById('monthPickerStatus').textContent = `已识别 ${satSunCols.length} 个周末列`;
    document.getElementById('monthPickerStatus').style.color = '#52c41a';
  } else {
    document.getElementById('monthPickerStatus').textContent = '未能识别周末列，请检查日期格式';
    document.getElementById('monthPickerStatus').style.color = '#ff4d4f';
  }
}

async function startProcess() {
  document.getElementById('btnProcess').disabled = true;
  document.getElementById('progressArea').classList.remove('hidden');
  setProgress(0, '加载班次配置...');

  // 先加载config.json
  const loaded = await loadConfig();
  if (!loaded) {
    document.getElementById('btnProcess').disabled = false;
    logMsg('err', '无法加载班次配置，请检查config.json文件是否存在');
    return;
  }

  setProgress(0, '开始处理...');
  empStats = [];

  const total = employees.length;
  for (let i = 0; i < total; i++) {
    if (i % 20 === 0) {
      setProgress(Math.round(i/total*90), `处理第 ${i+1}/${total} 名员工...`);
      await new Promise(r => setTimeout(r, 0));
    }
    empStats.push(processEmployee(employees[i]));
  }

  setProgress(95, '生成预览...');
  await new Promise(r => setTimeout(r, 0));
  renderSummary();
  renderPreview();
  setProgress(100, '处理完成！');
  document.getElementById('btnExport').disabled = false;
  document.getElementById('summaryCard').classList.remove('hidden');
  document.getElementById('previewCard').classList.remove('hidden');
  logMsg('ok', `处理完成！共 ${total} 名员工`);
}

function processEmployee(emp) {
  const dept = emp.dept;
  const isNoOt = dept.includes('保安') || dept.includes('卫生');
  const processedDays = preprocessCrossMidnight([...emp.days], dept);

  // 按人聚类定基准班次：用整月模式确定该员工专属的 1~N 个基准班次，供迟到判定与出勤/加班计算统一使用
  emp._baseShifts = computeEmployeeBaseShifts(emp, processedDays);
  EMP_CTX = { baseShifts: emp._baseShifts || [] };

  const stats = {
    name: emp.name, id: emp.id, dept,
    平时出勤天数:0, 平时加班工时:0, 周末天数:0, 周末加班工时:0,
    法定假日天数:0, 调休天数:0, 有薪天数:0,
    缺卡次数:0,
    '0点':0,'1点':0,'2点':0,'3点':0,
    '迟到/早退1-10分':0,'迟到/早退11-30分':0,'迟到/早退31-59分':0,'迟到/早退1小时以上':0,
    加班总时长:0, 备注:'',
    overtimeDaily:[], isWeekendDaily:[], lateDaily:[], latePunchDaily:[], missingDaily:[], halfDayDaily:[], earlyDaily:[], earlyPunchDaily:[],
    processedDays,     // 计算用（含跨天凌晨卡归入前一天，可能含下月1号列）
    rawDays: emp.days,  // 显示用（原始数据，可能含下月1号列）
  };

  // 只遍历 dateHeaders.length 天（不含下月1号）
  const dayLimit = dateHeaders.length;
  for (let dayIdx = 0; dayIdx < dayLimit; dayIdx++) {
    const timesStr = processedDays[dayIdx];
    if (!timesStr || timesStr.trim() === '' || timesStr.trim() === '-') {
      stats.overtimeDaily.push(0); stats.isWeekendDaily.push(false);
      stats.lateDaily.push(false); stats.latePunchDaily.push(null); stats.missingDaily.push([]); stats.halfDayDaily.push(false);
      stats.earlyDaily.push(false); stats.earlyPunchDaily.push(null);
      continue;
    }
    const bf = stripBreakfastTimes(parseTimes(timesStr), dept);
    let times = bf.times;
    const breakfastMissing = bf.breakfastMissing;
    if (!times.length) {
      stats.overtimeDaily.push(0); stats.isWeekendDaily.push(false);
      stats.lateDaily.push(false); stats.latePunchDaily.push(null);
      stats.missingDaily.push(breakfastMissing ? ['breakfast_missing'] : []);
      stats.缺卡次数 += breakfastMissing ? 1 : 0;
      stats.halfDayDaily.push(false);
      stats.earlyDaily.push(false); stats.earlyPunchDaily.push(null);
      continue;
    }
    times = dedupTimes(times);
    const hdr = String(dateHeaders[dayIdx]||'');
    const isWeekend = hdr.includes('周六') || hdr.includes('周日');
    stats.isWeekendDaily.push(isWeekend);

    // === 迟到判断 ===
    let late=false, latePunch=null, lateMin=0;
    const midCutoff = (dept.includes('保安') || dept.includes('卫生')) ? 5 : 6;
    const normalTimes = times.filter(t=>t.h>=midCutoff);
    if (dept.includes('保安') || dept.includes('卫生')) {
      if (dept.includes('保安')) {
        // 保安组：早班06:30 / 晚班16:00
        const hasMorn = normalTimes.some(t=>t.h<12);
        const hasEve = normalTimes.some(t=>t.h>=15 && t.h<17);
        if (hasMorn) {
          const first = normalTimes.filter(t=>t.h<12).reduce((a,b)=>timeToMin(a)<=timeToMin(b)?a:b);
          if (timeToMin(first) > 6*60+30) {
            late=true; latePunch=`${String(first.h).padStart(2,'0')}:${String(first.m).padStart(2,'0')}`;
            lateMin = timeToMin(first) - (6*60+30);
          }
        }
        if (hasEve && !late) {
          const first = normalTimes.filter(t=>t.h>=15&&t.h<17).reduce((a,b)=>timeToMin(a)<=timeToMin(b)?a:b);
          if (timeToMin(first) > 16*60) {
            late=true; latePunch=`${String(first.h).padStart(2,'0')}:${String(first.m).padStart(2,'0')}`;
            lateMin = timeToMin(first) - 16*60;
          }
        }
      } else {
        // 卫生组：只有06:30-16:30早班
        const hasMorn = normalTimes.some(t=>t.h<12);
        if (hasMorn) {
          const first = normalTimes.filter(t=>t.h<12).reduce((a,b)=>timeToMin(a)<=timeToMin(b)?a:b);
          if (timeToMin(first) > 6*60+30) {
            late=true; latePunch=`${String(first.h).padStart(2,'0')}:${String(first.m).padStart(2,'0')}`;
            lateMin = timeToMin(first) - (6*60+30);
          }
        }
      }
    } else if (normalTimes.length) {
      // 迟到判断：优先用员工整月基准班次(与早退同源)，避免逐日匹配漂移误判。
      // 员工基准班次由"到达+离开"双重拟合确定(见 computeEmployeeBaseShifts/inferDayShiftBySpan)，
      // 能稳定识别真实班次（如 06:30 班偶发 7 点后到 → 仍归 06:30，迟到精准标红、不与 07:00 班混淆）。
      const hasMorn = normalTimes.some(t=>t.h<12);
      if (hasMorn) {
        const first = normalTimes.filter(t=>t.h<12).reduce((a,b)=>timeToMin(a)<=timeToMin(b)?a:b);
        const fMin = timeToMin(first);
        let shiftStart = null;
        const baseShift = resolveShiftForDay(emp, times, dept, dayIdx, processedDays);
        if (baseShift) {
          const bMin = parseShiftTime(baseShift.start);
          shiftStart = {h: Math.floor(bMin/60), m: bMin%60};
        }
        if (!shiftStart) {
          const best = getBestShift(times, dept, dayIdx, processedDays);
          if (best && best.start) {
            const [bh, bm] = best.start.split(':').map(Number);
            shiftStart = {h: bh, m: bm};
          }
        }
        if (!shiftStart) {
          const lateStartStr = employeeLateBaseStart(emp, fMin);
          if (lateStartStr) {
            const bMin = parseShiftTime(lateStartStr);   // 按人聚类众数基准比对，准确区分早到/迟到
            shiftStart = {h: Math.floor(bMin/60), m: bMin%60};
          }
        }
        if (!shiftStart) shiftStart = getShiftStartFromDept(times, dept);
        if (timeToMin(first) > timeToMin(shiftStart)) {
          late=true; latePunch=`${String(first.h).padStart(2,'0')}:${String(first.m).padStart(2,'0')}`;
          lateMin = timeToMin(first) - timeToMin(shiftStart);
        }
      }
    }
    // 早退判断：基准=员工整月基准班次下班时间(matched.end，跨天班次 00:30 等按次日 +24h)
    // 优先用整月基准(与迟到同源)，避免逐日匹配漂移把 06:30 班员工误判为 07:00 班而错标早退。
    // 取 afternoon_end / afternoon_start 中的最晚卡作为"下班卡"；若它早于班次下班、且当天没有晚于班次下班的卡(含加班/晚走) → 记为早退
    // 例：CAM 06:30-16:00 班次，16:03 下班 = 比 16:00 晚 3 分钟 → 正常下班，不判早退
    let early=false, earlyPunch=null, earlyMin=0;
    {
      const matched = resolveShiftForDay(emp, times, dept, dayIdx, processedDays) || getBestShift(times, dept, dayIdx, processedDays);
      if (matched && matched.end) {
        let shiftEndMin = parseShiftTime(matched.end);
        if (shiftEndMin !== null) {
          if (shiftEndMin <= 30) shiftEndMin += 24*60; // 跨天班次(00:30 等)按次日
          const clsE = adjustClassified(classifyPunchTimes(times), dept, times);
          // 下班卡取 afternoon_end / afternoon_start / overtime_end 中的最晚一张（含晚班 23:00 这类被分到 overtime_end 的早退）
          const depCards = clsE.afternoon_end.concat(clsE.overtime_end);
          if (depCards.length) {
            const toMinX = (t)=>{ let m=timeToMin(t); if (t.h<5) m+=24*60; return m; };
            const lastDep = depCards.reduce((a,b)=>toMinX(a)>=toMinX(b)?a:b);
            const lastDepMin = toMinX(lastDep);
            if (lastDepMin < shiftEndMin) {
              // 当天是否有晚于班次下班的卡（加班/晚走）→ 若有则不判早退
              const hasLater = times.some(t => { let tm=timeToMin(t); if (t.h<5) tm+=24*60; return tm > shiftEndMin; });
              if (!hasLater) {
                early=true;
                earlyPunch=`${String(lastDep.h).padStart(2,'0')}:${String(lastDep.m).padStart(2,'0')}`;
                earlyMin = shiftEndMin - lastDepMin;
              }
            }
          }
        }
      }
    }
    // 迟到 + 早退 都计入这 4 列（当月次数之和）
    const bumpBucket = (min) => {
      if (min>=1&&min<=10) stats['迟到/早退1-10分']++;
      else if (min<=30) stats['迟到/早退11-30分']++;
      else if (min<=59) stats['迟到/早退31-59分']++;
      else stats['迟到/早退1小时以上']++;
    };
    if (late) bumpBucket(lateMin);
    if (early) bumpBucket(earlyMin);
    stats.lateDaily.push(late); stats.latePunchDaily.push(latePunch);
    stats.earlyDaily.push(early); stats.earlyPunchDaily.push(earlyPunch);

    // === 出勤/加班 ===
    const {attendanceDays, paidDays, overtimeHours, halfDay} = calcShiftAndOvertime(times, dept, dayIdx, processedDays);
    if (isWeekend) { stats.周末天数 += attendanceDays; stats.周末加班工时 += overtimeHours; }
    else { stats.平时出勤天数 += attendanceDays; stats.平时加班工时 += overtimeHours; }
    stats.overtimeDaily.push(overtimeHours);
    stats.halfDayDaily.push(halfDay);

    // 0-3点统计（所有人包括保安/卫生组）
    if (times.length) {
      const last = times[times.length-1];
      if (last.h < 6) {
        if (last.h===0) stats['0点']++; else if (last.h===1) stats['1点']++;
        else if (last.h===2) stats['2点']++; else if (last.h===3) stats['3点']++;
      }
    }

    // 缺卡
    let {count: mc, types: mt} = calcMissingCards(times, dept);
    if (breakfastMissing) { mc += 1; mt = mt.concat('breakfast_missing'); }
    stats.缺卡次数 += mc;
    stats.missingDaily.push(mt);
  }
  EMP_CTX = null;  // 释放员工上下文，避免影响后续处理/其他调用方

  stats.有薪天数 = stats.平时出勤天数 + stats.周末天数 + stats.法定假日天数 + stats.调休天数;
  stats.加班总时长 = stats.平时加班工时 + stats.周末加班工时;
  return stats;
}

function renderSummary() {
  const totalEmps = empStats.length;
  const totalLate = empStats.reduce((s,e)=>s+e['迟到/早退1-10分']+e['迟到/早退11-30分']+e['迟到/早退31-59分']+e['迟到/早退1小时以上'],0);
  const totalMissing = empStats.reduce((s,e)=>s+e.缺卡次数,0);
  const totalOt = empStats.reduce((s,e)=>s+e.加班总时长,0);
  const totalAttend = empStats.reduce((s,e)=>s+e.平时出勤天数+e.周末天数,0);
  const depts = new Set(empStats.map(e=>e.dept));

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="num">${totalEmps}</div><div class="label">员工总数</div></div>
    <div class="stat-card"><div class="num">${depts.size}</div><div class="label">部门数量</div></div>
    <div class="stat-card"><div class="num">${totalAttend.toFixed(1)}</div><div class="label">总出勤天数</div></div>
    <div class="stat-card"><div class="num red">${totalLate}</div><div class="label">迟到/早退总次数</div></div>
    <div class="stat-card"><div class="num red">${totalMissing}</div><div class="label">缺卡总次数</div></div>
    <div class="stat-card"><div class="num">${totalOt.toFixed(1)}h</div><div class="label">加班总时长</div></div>
  `;
}

function renderPreview() {
  const preview = empStats.slice(0, 20);
  const dayCount = dateHeaders.length;
  // 只显示前15个日期列，避免太宽
  const showDays = Math.min(dayCount - 1, 15);

  let html = '<table><thead><tr>';
  html += '<th>姓名</th><th>工号</th><th>部门</th>';
  for (let i = 0; i < showDays; i++) {
    const isWe = satSunCols.includes(i);
    html += `<th class="${isWe?'orange-bg':''}">${String(dateHeaders[i]).replace(/\n/,'<br>')}</th>`;
  }
  html += '<th>平时出勤</th><th>周末天数</th><th>有薪天数</th><th>缺卡次数</th><th>加班总时长</th>';
  html += '</tr></thead><tbody>';

  for (const st of preview) {
    // 打卡行
    html += `<tr><td rowspan="2">${st.name}</td><td rowspan="2">${st.id}</td><td rowspan="2">${st.dept}</td>`;
    for (let i = 0; i < showDays; i++) {
      const isWe = satSunCols.includes(i);
      const rawDay = st.rawDays[i] || '';
      const missing = st.missingDaily[i] || [];
      const latePunch = st.latePunchDaily[i];
      const earlyPunch = st.earlyPunchDaily[i];
      const halfDay = st.halfDayDaily[i];
      let lines = rawDay ? rawDay.split('\n') : [];
      // 插入缺卡标记
      const insertions = [];
      for (const mt of missing) {
        if (mt==='morning_start') insertions.push({pos:0,label:'缺卡'});
        else if (mt==='noon_end') { let p=lines.findIndex(l=>{ try{return parseInt(l.split(':')[0])>=13;}catch{return false;}}); if(p<0)p=lines.length; insertions.push({pos:p,label:'缺卡'}); }
        else if (mt==='afternoon_start') { let p=lines.findIndex(l=>{try{const h=parseInt(l.split(':')[0]);return h>=17||l==='缺卡';}catch{return false;}}); if(p<0)p=lines.length; insertions.push({pos:p,label:'缺卡'}); }
        else if (mt==='afternoon_end') { let p=lines.findIndex(l=>{try{const h=parseInt(l.split(':')[0]);return h>=18||l==='缺卡';}catch{return false;}}); if(p<0)p=lines.length; insertions.push({pos:p,label:'缺卡'}); }
        else insertions.push({pos:lines.length, label:'缺卡'});
      }
      insertions.sort((a,b)=>b.pos-a.pos);
      for (const ins of insertions) lines.splice(ins.pos,0,'缺卡');
      // 插入半天标记
      if (halfDay) {
        let firstCardLine = lines.find(l => l !== '缺卡');
        let firstCardHour = 12;
        if (firstCardLine) { try { firstCardHour = parseInt(firstCardLine.split(':')[0]); } catch(e) {} }
        if (firstCardHour < 12) lines.push('半天');
        else lines.unshift('半天');
      }
      const cellHtml = lines.map(l=> l==='缺卡' ? `<span class="red">缺卡</span>` : l==='半天' ? `<span class="red">半天</span>` : (l===latePunch || l===earlyPunch ? `<span class="red">${l}</span>` : l)).join('<br>');
      html += `<td class="punch-cell ${isWe?'orange-bg':''}">${cellHtml}</td>`;
    }
    // 统计列（不合并）
    html += `<td>${st.平时出勤天数}</td><td>${st.周末天数}</td><td>${st.有薪天数}</td>`;
    html += `<td class="${st.缺卡次数>0?'red':''}">${st.缺卡次数}</td>`;
    html += `<td class="${st.加班总时长>0?'red':''}">${st.加班总时长||''}</td>`;
    html += '</tr>';
    // 加班行
    html += '<tr>';
    for (let i = 0; i < showDays; i++) {
      const isWe = satSunCols.includes(i);
      const ot = st.overtimeDaily[i];
      html += `<td class="${isWe?'orange-bg':''} ${ot&&ot!==0?'red':''}">${ot&&ot!==0?ot:''}</td>`;
    }
    // 统计列下方留空
    html += '<td></td><td></td><td></td><td></td><td></td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('previewTable').innerHTML = html;
}
